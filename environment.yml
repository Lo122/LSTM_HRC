name: itech-thesis-2026

channels:
  - conda-forge
  - defaults

dependencies:
  # ── Python & core numeric ──────────────────────────────────────────────────
  - python=3.14
  - numpy=2.4.2

  # ── pip packages ──────────────────────────────────────────────────────────
  - pip
  - pip:
    # PyTorch with CUDA 12.8 (install from PyTorch index)
    - --extra-index-url https://download.pytorch.org/whl/cu128
    - torch==2.10.0+cu128
    - torchvision==0.25.0+cu128
    - torchaudio==2.10.0+cu128

    # Data science
    - pandas==3.0.2
    - scipy==1.17.1

    # Visualisation
    - matplotlib==3.10.8
    - plotly==6.6.0

    # Streamlit app
    - streamlit==1.56.0

    # Computer vision & image processing
    - opencv-python==4.13.0.92
    - pillow==12.1.1

    # Pose estimation (YOLO)
    - ultralytics==8.4.26

    # Utilities
    - tqdm==4.67.3
